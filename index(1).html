    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;

      overflow-x: hidden;
      position: relative;

    .stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

    main {
      position: relative; z-index: 1;
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: 42px 0 52px;
      display: flex; flex-direction: column; align-items: center;
    }
    .logo-wrap {
      width: 210px; height: 210px; border: 2px solid var(--navy);
      border-radius: 50%; background: rgba(255,255,255,.82);
      display: grid; place-items: center;
      box-shadow: 0 8px 24px rgba(8,45,105,.08);
      overflow: hidden;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(2.4rem, 11vw, 3.4rem); letter-spacing: .01em; margin: 20px 0 4px; color: var(--navy); }
    .place { font-size: .95rem; letter-spacing: .34em; text-transform: uppercase; text-align: center; margin: 0; }
    .rule { width: 48px; height: 2px; background: var(--blue); margin: 16px 0 14px; }
    .subtitle { margin: 0 0 34px; font-size: .86rem; letter-spacing: .19em; text-transform: uppercase; text-align: center; }
    .links { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    .link {
      min-height: 86px; display: flex; align-items: center; gap: 18px;
      padding: 15px 22px; border: 1.5px solid var(--line); border-radius: 999px;
      color: var(--navy); text-decoration: none; background: rgba(255,255,255,.92);
      box-shadow: 0 8px 20px rgba(24,78,145,.08);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .link:nth-child(odd) { background: linear-gradient(110deg, #e8f3ff, #fff); }
    .link:hover, .link:focus-visible { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(24,78,145,.14); outline: none; }
    .icon { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; }
    .icon svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .copy strong { font-size: 1.08rem; font-weight: 650; }
    .copy span { font-size: .9rem; letter-spacing: .12em; opacity: .88; overflow-wrap: anywhere; }
    .chevron { margin-left: auto; font-size: 1.8rem; font-weight: 300; line-height: 1; }
    footer { margin-top: 34px; font-family: Georgia, "Times New Roman", serif; font-style: italic; color: var(--blue); font-size: 1rem; text-align: center; }
    @media (max-width: 380px) {
      main { width: min(100% - 24px, 520px); padding-top: 32px; }
      .logo-wrap { width: 178px; height: 178px; }
      .link { min-height: 78px; padding: 12px 17px; gap: 12px; }
      .copy strong { font-size: 1rem; }
      .copy span { font-size: .82rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
